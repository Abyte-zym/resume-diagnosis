<script>
const checklistDB = {
  tech: ["包含Java关键词", "有Spring/Spring Boot", "有MySQL或数据库", "有Redis或缓存", "有Docker/Linux", "有Git版本控制"],
  project: ["项目有量化数据(QPS/响应时间)", "项目描述含技术栈", "有独立开发或负责描述", "项目与目标岗位JD匹配"],
  format: ["一页纸以内", "无英文拼写错", "无过分夸张描述", "有GitHub/博客链接"],
  education: ["有学历和专业", "有毕业年份", "有英语等级", "有竞赛或奖学金"],
  ai: ["有AI/大模型相关经历", "有Spring AI或LangChain", "有AIGC竞赛或项目"]
}

function diagnose() {
  const text = document.getElementById('resumeInput').value.trim()
  if (!text) return alert('请先粘贴简历内容')
  
  document.getElementById('result').style.display = 'block'
  
  const lower = text.toLowerCase()
  
  // Score each dimension
  const dims = {
    '技术栈': {score: scoreCheck(lower, checklistDB.tech), max: checklistDB.tech.length, items: checklistDB.tech},
    '项目经历': {score: scoreCheck(lower, checklistDB.project), max: checklistDB.project.length, items: checklistDB.project},
    '格式规范': {score: scoreCheck(lower, checklistDB.format) + (text.length < 2000 ? 1 : 0), max: checklistDB.format.length + 1, items: checklistDB.format},
    '教育背景': {score: scoreCheck(lower, checklistDB.education), max: checklistDB.education.length, items: checklistDB.education},
    'AI加分': {score: scoreCheck(lower, checklistDB.ai), max: checklistDB.ai.length, items: checklistDB.ai}
  }
  
  // Render scores
  let scoreHTML = ''
  let totalScore = 0, totalMax = 0
  for (const [name, d] of Object.entries(dims)) {
    const pct = Math.round(d.score / d.max * 100)
    totalScore += d.score; totalMax += d.max
    const cls = pct >= 70 ? 'score-high' : pct >= 40 ? 'score-mid' : 'score-low'
    scoreHTML += `<div class="score-item"><div class="label">${name}</div><div class="value ${cls}">${pct}%</div><div style="font-size:.7rem;color:#94a3b8">${d.score}/${d.max}</div></div>`
  }
  document.getElementById('scores').innerHTML = scoreHTML
  
  // Render checklist
  let checkHTML = ''
  for (const [name, d] of Object.entries(dims)) {
    const checked = scoreItems(lower, d.items)
    for (const c of checked) {
      checkHTML += `<div class="check${c.ok ? '' : ' fail'}">${c.item}</div>`
    }
  }
  document.getElementById('checklist').innerHTML = checkHTML
  
  // Render tips
  const overallPct = Math.round(totalScore / totalMax * 100)
  let tipsHTML = `<h4>💡 优化建议（综合评分：${overallPct}%）</h4><ul>`
  
  const missing = []
  for (const [name, d] of Object.entries(dims)) {
    const checked = scoreItems(lower, d.items)
    for (const c of checked) {
      if (!c.ok) missing.push(`[${name}] ${c.item}`)
    }
  }
  
  if (overallPct >= 80) {
    tipsHTML += `<li>✅ 简历质量不错！核心关键词齐全。建议增加更多量化数据（如QPS、响应时间、用户量）让简历更有说服力。</li>`
  } else if (overallPct >= 50) {
    tipsHTML += `<li>⚠️ 简历中等水平。最需补充：${missing.slice(0, 3).join('、')}</li>`
  } else {
    tipsHTML += `<li>🚨 简历需要大幅优化。核心问题：${missing.slice(0, 3).join('、')}</li>`
  }
  
  tipsHTML += `<li>📌 2026年必加：Spring AI/大模型相关经历——这是今年面试最大加分项。</li>`
  tipsHTML += `<li>📌 每个项目必须带量化结果：不说"负责XX"而说"通过XX将QPS从300提升到5000"。</li>`
  tipsHTML += `<li>💰 想要深度1v1简历辅导？扫描下方赞赏码，我帮你逐行优化。</li></ul>`
  
  document.getElementById('tips').innerHTML = tipsHTML
  document.getElementById('result').scrollIntoView({behavior:'smooth'})
}

function scoreCheck(text, items) {
  let score = 0
  for (const item of items) {
    const kw = item.replace(/[()/]/g, ' ').split(' ').filter(w => w.length > 1)
    if (kw.some(w => text.includes(w.toLowerCase()))) score++
  }
  return score
}

function scoreItems(text, items) {
  return items.map(item => {
    const kw = item.replace(/[()/]/g, ' ').split(' ').filter(w => w.length > 1)
    return {item, ok: kw.some(w => text.includes(w.toLowerCase()))}
  })
}

function loadSample() {
  document.getElementById('resumeInput').value = `张三 | Java后端实习生 | 138xxxx | zhangsan@qq.com

技术栈：

项目经历：

- RocketMQ异步下单削峰填谷，消息表+定时对账保证最终一致性

荣誉奖项：
AIGC创新赛全国三等奖 | 数学建模省一等奖 | 蓝桥杯C++省级三等奖`
}
</script>
